spring:
  liquibase:
    contexts: dev
    drop-first: true
    clear-checksums: true

  datasource:
    url: ${JDBC_URL:jdbc:mysql://localhost:3306/walletdb}
    username: ${JDBC_USER:root}
    password: ${JDBC_PASSWORD:root}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  data:
    redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"   

  # Cache configuration
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-only-for-local-testing-min-32-chars}
  expiration: ${JWT_EXPIRATION:60m}

logging:
  level:
    root: INFO
    com.snapppay.wallet: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    liquibase: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"  # Expose all endpoints in dev
  endpoint:
    health:
      show-details: always