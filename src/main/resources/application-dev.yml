# Development environment configuration
spring:
  liquibase:
    contexts: dev
    drop-first: true
    clear-checksums: true

  datasource:
    url: ${JDBC_URL:jdbc:mysql://localhost:3306/walletdb}
    username: ${JDBC_USER:root}
    password: ${JDBC_PASSWORD:root}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  # Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # Cache configuration
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

# Development server settings
server:
  port: ${PORT:8080}

# JWT - less strict for development
jwt:
  secret: ${JWT_SECRET:dev-secret-key-only-for-local-testing-min-32-chars}
  expiration: ${JWT_EXPIRATION:60m}

# Detailed logging for development
logging:
  level:
    root: INFO
    com.snapppay.wallet: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    liquibase: DEBUG

# Development-specific features
management:
  endpoints:
    web:
      exposure:
        include: "*"  # Expose all endpoints in dev
  endpoint:
    health:
      show-details: always