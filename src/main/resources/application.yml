spring:
  application:
    name: Wallet-Service
  profiles:
    active: dev
  
  liquibase:
    change-log: classpath:/config/liquibase/master.xml
    enabled: true
  
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  
  cache:
    type: redis

server:
  port: ${PORT:8080}
  shutdown: graceful

# values come from provided outsource configurations f.g Vault
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:15m}

app:
  default-currency: ${DEFAULT_CURRENCY:USD}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized